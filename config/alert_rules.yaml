alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(latency_ms) > 2500ms
    duration: 3m
    type: symptom-based
    channel: slack
    owner: platform-oncall
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2%
    duration: 2m
    type: symptom-based
    channel: slack
    owner: llmops-oncall
    runbook: docs/alerts.md#alert-2
  - name: CostSpikeAnomaly
    severity: warning
    condition: cost_rate_per_min > 0.05$
    duration: 5m
    type: symptom-based
    channel: slack
    owner: finops-oncall
    runbook: docs/alerts.md#alert-3
